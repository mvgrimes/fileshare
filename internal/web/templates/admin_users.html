{{define "admin_users"}}{{template "base" .}}{{end}}

{{define "admin_users_content"}}
<section class="card bg-base-100 shadow-sm mb-4">
  <div class="card-body gap-4">
    {{template "page_header" .}}
    <h2 class="text-lg font-semibold">Create User</h2>
    <form method="post" action="/admin/users" class="grid gap-3 md:grid-cols-2" data-enhance="submission">
      <input class="input input-bordered w-full" type="email" name="email" placeholder="user@example.com" required>
      <input class="input input-bordered w-full" type="text" name="full_name" placeholder="Full name" required>
      <select class="select select-bordered w-full" name="role_id" required>
        {{range .Roles}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
      </select>
      <input class="input input-bordered w-full" type="password" name="new_password" minlength="12" placeholder="Optional password">
      <label class="label cursor-pointer justify-start gap-2 md:col-span-2"><input class="checkbox" type="checkbox" name="is_active" value="1" checked><span class="label-text">Active account</span></label>
      <button class="btn btn-primary md:col-span-2" type="submit" data-pending-text="Creating...">Create User</button>
    </form>
  </div>
</section>

<section class="card bg-base-100 shadow-sm">
  <div class="card-body gap-4">
    <h2 class="text-lg font-semibold">Existing Users</h2>
    <div class="overflow-x-auto">
      <table class="table table-zebra">
        <thead><tr><th>Email</th><th>Name</th><th>Roles</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          {{range .Users}}
          <tr>
            <td>{{.Email}}</td>
            <td>{{.FullName}}</td>
            <td>{{.RoleNames}}</td>
            <td>{{if .IsActive}}active{{else}}inactive{{end}}</td>
            <td>
              <form method="post" action="/admin/users/{{.ID}}" class="grid gap-2 md:grid-cols-4" data-enhance="submission">
                <input class="input input-bordered input-sm" type="text" name="full_name" value="{{.FullName}}" required>
                <select class="select select-bordered select-sm" name="role_id" required>
                  {{range $.Roles}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
                </select>
                <label class="label cursor-pointer justify-start gap-2"><input class="checkbox checkbox-sm" type="checkbox" name="is_active" value="1" {{if .IsActive}}checked{{end}}><span class="label-text">active</span></label>
                <button class="btn btn-sm btn-outline" type="submit" data-pending-text="Saving...">Save</button>
              </form>
              <form method="post" action="/admin/users/{{.ID}}/reset-password" class="mt-2 flex gap-2" data-enhance="submission">
                <input class="input input-bordered input-sm" type="password" name="new_password" minlength="12" placeholder="Reset password" required>
                <button class="btn btn-sm btn-secondary" type="submit" data-pending-text="Resetting...">Reset Password</button>
              </form>
            </td>
          </tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </div>
</section>
{{end}}
