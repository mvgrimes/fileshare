{{define "base"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}}</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Home</a>
        <a href="/user/dashboard">User</a>
        <a href="/client/dashboard">Client</a>
        <a href="/admin/dashboard">Admin</a>
      </nav>
    </header>
    <main>
      {{if eq .ContentTemplate "home_content"}}
        {{template "home_content" .}}
      {{else if eq .ContentTemplate "dashboard_content"}}
        {{template "dashboard_content" .}}
      {{else}}
        <p>missing content template</p>
      {{end}}
    </main>
  </body>
</html>
{{end}}
