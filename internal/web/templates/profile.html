{{define "profile"}}{{template "base" .}}{{end}}

{{define "profile_content"}}
<section class="card bg-base-100 shadow-sm">
  <div class="card-body gap-4">
    {{template "page_header" .}}
    <form method="post" action="{{.FormAction}}" class="grid gap-3 md:grid-cols-2" data-enhance="submission">
      <label class="form-control w-full md:col-span-2">
        <span class="label-text">Email</span>
        <input class="input input-bordered w-full" type="email" value="{{.Email}}" readonly>
      </label>
      <label class="form-control w-full md:col-span-2">
        <span class="label-text">Display Name</span>
        <input class="input input-bordered w-full" type="text" name="display_name" value="{{.DisplayName}}" required>
      </label>
      <label class="form-control w-full md:col-span-2">
        <span class="label-text">New Password</span>
        <input class="input input-bordered w-full" type="password" name="new_password" minlength="12" placeholder="Leave blank to keep current password">
      </label>
      <label class="form-control w-full md:col-span-2">
        <span class="label-text">Confirm Password</span>
        <input class="input input-bordered w-full" type="password" name="confirm_password" minlength="12" placeholder="Repeat new password">
      </label>
      <button class="btn btn-primary md:col-span-2" type="submit" data-pending-text="Saving...">Save Profile</button>
    </form>
  </div>
</section>
{{end}}
