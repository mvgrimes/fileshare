{{define "verify_token_content"}}
<section class="grid gap-4">
  <article class="card bg-base-100 shadow-sm">
    <div class="card-body gap-3">
      {{template "page_header" .}}
      <form method="post" action="/auth/magic/verify" class="space-y-3" data-enhance="submission">
        <label class="form-control w-full">
          <span class="label-text">Email Address</span>
          <input class="input input-bordered w-full" type="email" name="client_id" required value="{{.MagicClientID}}">
        </label>
        <label class="form-control w-full">
          <span class="label-text">Token</span>
          <input class="input input-bordered w-full" type="text" name="token" required value="{{.MagicToken}}">
        </label>
        {{if .TurnstileEnabled}}<div class="cf-turnstile" data-sitekey="{{.TurnstileSiteKey}}"></div>{{end}}
        <button class="btn btn-primary w-full" type="submit" data-pending-text="Verifying...">Verify and Sign In</button>
      </form>
      <a class="link link-primary text-sm" href="/request-link">Need a token? Request one</a>
      <a class="link link-primary text-sm" href="/login">Back to login options</a>
    </div>
  </article>
</section>
{{end}}
