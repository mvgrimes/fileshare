{{define "login_content"}}
<section class="grid gap-4">
  <article class="card bg-base-100 shadow-sm">
    <div class="card-body">
      <div class="flex w-full flex-col gap-2">
        <div class="space-y-3">
          <h2 class="text-xl font-semibold">Password Login</h2>
          <form method="post" action="/auth/password/login" class="space-y-3" data-enhance="submission">
            <label class="form-control w-full">
              <span class="label-text">Email</span>
              <input class="input input-bordered w-full" type="email" name="email" required>
            </label>
            <label class="form-control w-full">
              <span class="label-text">Password</span>
              <input class="input input-bordered w-full" type="password" name="password" required>
            </label>
            <button class="btn btn-primary w-full" type="submit" data-pending-text="Signing In...">Sign In</button>
          </form>
          <a class="link link-primary text-sm" href="/reset-password/request">Forgot password?</a>
        </div>
        <div class="divider">OR</div>
        <div class="space-y-3">
          <h2 class="text-xl font-semibold">Magic Link Login</h2>
          <form method="post" action="/auth/magic/request" class="space-y-3" data-enhance="submission">
            <label class="form-control w-full">
              <span class="label-text">Email Address</span>
              <input class="input input-bordered w-full" type="email" name="client_id" required value="{{.MagicClientID}}">
            </label>
            <button class="btn btn-secondary w-full" type="submit" data-pending-text="Sending...">Send Magic Link</button>
          </form>
          <a class="link link-primary text-sm" href="/verify-token">Already have a token? Verify it</a>
        </div>
      </div>
    </div>
  </article>
</section>
{{end}}
