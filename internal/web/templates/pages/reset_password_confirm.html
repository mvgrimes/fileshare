{{define "password_reset_confirm_content"}}
<section class="grid gap-4">
  <article class="card bg-base-100 shadow-sm">
    <div class="card-body gap-3">
      {{template "page_header" .}}
      <form method="post" action="/auth/password/reset/confirm" class="space-y-3" data-enhance="submission">
        <input type="hidden" name="token" value="{{.Token}}">
        <label class="form-control w-full">
          <span class="label-text">New Password</span>
          <input class="input input-bordered w-full" type="password" name="new_password" required>
        </label>
        <button class="btn btn-primary w-full" type="submit" data-pending-text="Resetting...">Reset Password</button>
      </form>
      <a class="link link-primary text-sm" href="/login">Back to login</a>
    </div>
  </article>
</section>
{{end}}
