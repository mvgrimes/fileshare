{{define "app_nav"}}
<header class="border-b border-base-300 bg-base-100">
  <nav class="navbar px-2 md:px-4">
    <div class="flex-1 gap-2">
      {{if .UseAppDrawer}}
      <label
        for="app-drawer"
        class="btn btn-square btn-ghost drawer-button md:hidden"
        aria-label="Open menu"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="h-5 w-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5m-16.5 5.25h16.5m-16.5 5.25h16.5"
          />
        </svg>
      </label>
      <button
        id="app-drawer-desktop-toggle"
        type="button"
        class="btn btn-square btn-ghost hidden md:inline-flex"
        aria-label="Collapse menu"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="h-5 w-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 19.5 8.25 12l7.5-7.5"
          />
        </svg>
      </button>
      {{end}}
      <a class="btn btn-ghost text-lg gap-2" href="/"
        >{{if .BrandLogo}}<img
          src="{{.BrandLogo}}"
          alt="{{.BrandingLabel}} logo"
          class="h-6 w-6 object-contain"
        />{{end}}<span>{{.BrandingLabel}}</span></a
      >
    </div>
    <div class="flex gap-2">
      {{if .IsAuthenticated}}
      <a class="btn btn-sm btn-ghost" href="{{.DashboardPath}}">Dashboard</a>
      <form method="post" action="/auth/logout" data-enhance="submission">
        <button
          class="btn btn-sm btn-outline"
          type="submit"
          data-pending-text="Logging out..."
        >
          Logout
        </button>
      </form>
      {{end}}
    </div>
  </nav>
</header>
{{end}}
