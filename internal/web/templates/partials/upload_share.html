{{define "upload_share_form_partial"}}
<section class="card bg-base-100 shadow-sm">
  <div class="card-body gap-4">
    {{template "page_header" .}}
    <form method="post" action="{{.FormAction}}" enctype="multipart/form-data" class="grid gap-3 md:grid-cols-2" data-enhance="submission" data-target-select-form>
      {{if .ShowShareFields}}
      <label class="form-control w-full md:col-span-2">
        <span class="label-text">Upload File</span>
        <input class="file-input file-input-bordered w-full" type="file" name="upload_file" data-upload-file-input>
      </label>
      <div class="w-full rounded-box border border-dashed border-base-300 bg-base-200/50 p-6 text-center md:col-span-2" data-upload-dropzone tabindex="0" role="button" aria-label="Drag and drop file upload area">
        <p class="font-medium">Drag and drop a file here</p>
        <p class="text-sm opacity-70">or click to choose a file</p>
      </div>
      <label class="form-control w-full md:col-span-2">
        <span class="label-text">Filename</span>
        <input class="input input-bordered w-full" type="text" name="filename" placeholder="quarterly-report.pdf" required data-upload-filename>
      </label>
      {{end}}
      <label class="form-control w-full">
        <span class="label-text">Target Type</span>
        <select class="select select-bordered w-full" name="target_type" required data-target-type-select>
          {{if .ClientUploadMode}}
          <option value="user" selected>User</option>
          <option value="user_group">User Group</option>
          {{else}}
          <option value="client" selected>Client</option>
          <option value="client_group">Client Group</option>
          {{end}}
        </select>
      </label>
      <label class="form-control w-full">
        <span class="label-text">Target ID</span>
        <select class="select select-bordered w-full" name="target_id" required data-target-id-select>
          {{if .ClientUploadMode}}
          {{range .Users}}
          <option value="{{.ID}}" data-target-option="user">{{.FullName}} ({{.Email}})</option>
          {{end}}
          {{range .UserGroups}}
          <option value="{{.ID}}" data-target-option="user_group">{{.Name}}</option>
          {{end}}
          {{else}}
          {{range .Clients}}
          <option value="{{.ID}}" data-target-option="client">{{.DisplayName}} ({{.Email}})</option>
          {{end}}
          {{range .ClientGroups}}
          <option value="{{.ID}}" data-target-option="client_group">{{.Name}}</option>
          {{end}}
          {{end}}
        </select>
      </label>
      <label class="form-control w-full md:col-span-2">
        <span class="label-text">Message...</span>
        <textarea class="textarea textarea-bordered w-full" name="message" rows="3" placeholder="Optional message to include with the share"></textarea>
      </label>
      <button class="btn btn-primary md:col-span-2" type="submit" data-pending-text="Submitting...">Submit</button>
    </form>
  </div>
</section>
{{end}}
