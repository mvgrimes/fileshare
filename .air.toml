root = "."
testdata_dir = "testdata"
tmp_dir = "_tmp"

[build]
  args_bin = ['server']
  bin = "./fileshare"
  cmd = "just build"
  delay = 1
  exclude_dir = ["dist", "tmp", "_tmp", "vendor", "testdata", "node_modules", "data"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  # full_bin = "FILESHARE_SERVER_PORT=8090 ./fileshare"
  include_dir = []
  include_ext = ["go", "tpl", "tmpl"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
